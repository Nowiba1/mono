<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <circle cx="96" cy="96" r="76" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="6 4" opacity="0.4" />
  
  <!-- Stylized Empire City Spire -->
  <path d="M96 28 L114 68 L104 68 L112 110 L124 150 L68 150 L80 110 L88 68 L78 68 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <polygon points="96,28 100,50 92,50" fill="#38bdf8" />
  
  <!-- Flanking Towers -->
  <rect x="52" y="98" width="22" height="52" rx="3" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
  <rect x="118" y="98" width="22" height="52" rx="3" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
  
  <!-- Golden Crown / Die Emblem -->
  <g transform="translate(68, 102)" filter="url(#glow)">
    <rect x="0" y="0" width="56" height="50" rx="12" fill="url(#goldGrad)" />
    <!-- Die Dots or Crown Teeth -->
    <circle cx="16" cy="14" r="4.5" fill="#451a03" />
    <circle cx="40" cy="14" r="4.5" fill="#451a03" />
    <circle cx="28" cy="25" r="4.5" fill="#451a03" />
    <circle cx="16" cy="36" r="4.5" fill="#451a03" />
    <circle cx="40" cy="36" r="4.5" fill="#451a03" />
  </g>
</svg>
